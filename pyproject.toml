[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statics-diagrams"
version = "0.3.0"
description = "Publication-quality, analysis-free statics diagrams in standalone SVG and Matplotlib."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Marcus Funt" }]
keywords = ["engineering", "matplotlib", "mechanics", "statics", "svg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
matplotlib = ["matplotlib>=3.7"]
all = ["matplotlib>=3.7"]
dev = [
    "matplotlib>=3.7",
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/MarcusFunt/Statisk-System-Figur-Generering"
Repository = "https://github.com/MarcusFunt/Statisk-System-Figur-Generering"
Issues = "https://github.com/MarcusFunt/Statisk-System-Figur-Generering/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
statics_diagrams = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E701", "E702", "E703"]

[tool.mypy]
python_version = "3.10"
follow_imports = "skip"
no_site_packages = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["tests/"]
