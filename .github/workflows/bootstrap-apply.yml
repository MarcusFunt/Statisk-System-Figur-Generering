name: Apply tested branch payload

on:
  push:
    branches:
      - fix/all-open-issues-edge-cases

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify tested payload
        shell: bash
        run: |
          cat .bootstrap/payload-*.txt | base64 --decode > /tmp/statics-payload.tar.gz
          echo 'b58050a69a4cf6e02f752141284eed638f6096469e7550e769c52cbddccf37f4  /tmp/statics-payload.tar.gz' | sha256sum -c -
          tar -xzf /tmp/statics-payload.tar.gz
      - name: Commit implementation and remove transport files
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'feat: resolve statics-diagrams issue backlog'
          git push origin HEAD:${GITHUB_REF_NAME}
